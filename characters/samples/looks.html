<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0b1726; --card:#12233a; --ink:#e8f1f2; --muted:#9fb3c8; --mint:#5be3b5; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 Sora, system-ui, sans-serif; }
  header { padding:28px 16px 8px; max-width:1500px; margin:0 auto; }
  h1 { margin:0 0 4px; font-size:28px; } h1 span { color:var(--mint); }
  header p { margin:0; color:var(--muted); max-width:900px; }
  .bar { display:flex; gap:10px; flex-wrap:wrap; margin:14px 0 0; }
  button { font:inherit; background:#1c3555; color:var(--ink); border:1px solid #2b4b72; border-radius:999px; padding:6px 16px; cursor:pointer; }
  button.on { background:var(--mint); color:#0b1726; border-color:var(--mint); }
  main { display:grid; grid-template-columns:repeat(auto-fill, minmax(420px, 1fr)); gap:18px; padding:16px; max-width:1500px; margin:0 auto; }
  figure { margin:0; background:var(--card); border-radius:16px; overflow:hidden; box-shadow:0 8px 30px #0006; }
  canvas { display:block; width:100%; aspect-ratio:16/9; }
  canvas.px { image-rendering: pixelated; }
  .slider { display:flex; align-items:center; gap:8px; color:var(--muted); } .slider input { accent-color: var(--mint); }
  figcaption { padding:10px 14px 14px; } figcaption b { font-size:16px; } figcaption small { display:block; color:var(--muted); }
  @media (max-width:480px) { main { grid-template-columns:1fr; padding:16px; } }
</style>
</head>

<header>

  <p>The same two characters, the same skeleton, the same talking and blinking, twenty ways of drawing them. Nothing here is a picture: every frame is drawn from a short list of settings, so a new character or a new look costs nothing to make.</p>
  <div class="bar"><button id="play" class="on">Playing</button><button id="side">Turn to 3/4</button>
    <label class="slider">Line boil <input id="boil" type="range" min="0" max="4" step="0.1" value="1.2"> <span id="boilv">1.2</span></label>
    <button id="boilall">Line boil on every look</button></div>
</header>

const hexRgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const shade = (h, k) => { const [r, g, b] = hexRgb(h); const f = (c) => Math.max(0, Math.min(255, Math.round(k < 0 ? c * (1 + k) : c + (255 - c) * k))); return `rgb(${f(r)},${f(g)},${f(b)})`; };
const TAU = Math.PI * 2;

  { id: "boil", name: "Line boil (an effect on any look)", blurb: "The outlines wobble a little every few frames: hand-drawn and alive. Shown on the stick look.",
    p: { headR: .145, sy: -.66, hy: -.40, sw: .085, hw: .07 }, outline: .006, limb: "line", limbW: .009, eyes: "dot", mouth: "plain", bg: "room", boil: true },
];

// ---------------------------------------------------------------------------------------------
// The pen: every shape goes through it, so "line boil" wobbles everything the same way
// ---------------------------------------------------------------------------------------------
function makePen(ctx, look, t, S) {
  const on = look.boil || BOIL_ALL || look.boilAmp;
  const step = on ? Math.floor(t * (look.boilRate || 8)) : 0; // boil changes 8 times a second, like drawn-on-twos
  const amp = on ? (look.boilAmp && !BOIL_ALL && !look.boil ? look.boilAmp : BOIL) * (S / 300) : 0;
  let n = 0;
  const j = (x, y) => (amp ? [x + (hash(step, n++) - .5) * amp * 2, y + (hash(step + 999, n++) - .5) * amp * 2] : [x, y]);
  const pen = {
    ctx, S,
    poly(pts, closed = true) { const q = pts.map(([x, y]) => j(x, y)); pen.last = { q, closed }; pen.trace(q, closed); },
    trace(q, closed, dx = 0, dy = 0) { ctx.beginPath(); q.forEach(([a, b], i) => (i ? ctx.lineTo(a + dx, b + dy) : ctx.moveTo(a + dx, b + dy))); if (closed) ctx.closePath(); },
    ellipse(cx, cy, rx, ry, rot = 0, a0 = 0, a1 = TAU) {
      const k = 32, pts = [];
      for (let i = 0; i <= k; i++) { const a = a0 + (a1 - a0) * i / k; const x = Math.cos(a) * rx, y = Math.sin(a) * ry; pts.push([cx + x * Math.cos(rot) - y * Math.sin(rot), cy + x * Math.sin(rot) + y * Math.cos(rot)]); }
      pen.poly(pts, a1 - a0 >= TAU - 1e-6);
    },
    circle(cx, cy, r) { pen.ellipse(cx, cy, r, r); },
    blob(pts) { // closed smooth curve through the points
      const n = pts.length, out = [];
      for (let i = 0; i < n; i++) {
        const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
        for (let s = 0; s < 8; s++) { const u = s / 8, u2 = u * u, u3 = u2 * u;
          out.push([0, 1].map((d) => .5 * (2 * p1[d] + (-p0[d] + p2[d]) * u + (2 * p0[d] - 5 * p1[d] + 4 * p2[d] - p3[d]) * u2 + (-p0[d] + 3 * p1[d] - 3 * p2[d] + p3[d]) * u3))); }
      }
      pen.poly(out, true);
    },
    rpoly(pts, rad) { // polygon with rounded corners
      const n = pts.length, out = [];
      for (let i = 0; i < n; i++) {
        const a = pts[(i - 1 + n) % n], b = pts[i], c = pts[(i + 1) % n];
        const la = Math.hypot(a[0] - b[0], a[1] - b[1]), lc = Math.hypot(c[0] - b[0], c[1] - b[1]), r = Math.min(rad, la / 2.2, lc / 2.2);
        const p = [b[0] + (a[0] - b[0]) * r / la, b[1] + (a[1] - b[1]) * r / la], q = [b[0] + (c[0] - b[0]) * r / lc, b[1] + (c[1] - b[1]) * r / lc];
        for (let k = 0; k <= 6; k++) { const u = k / 6; out.push([(1 - u) * (1 - u) * p[0] + 2 * (1 - u) * u * b[0] + u * u * q[0], (1 - u) * (1 - u) * p[1] + 2 * (1 - u) * u * b[1] + u * u * q[1]]); }
      }
      pen.poly(out, true);
    },
    curve(pts) { // smooth through points (Catmull-Rom sampled)
      const out = [];
      for (let i = 0; i < pts.length - 1; i++) {
        const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
        for (let s = 0; s < 10; s++) { const u = s / 10, u2 = u * u, u3 = u2 * u;
          out.push([0, 1].map((d) => .5 * (2 * p1[d] + (-p0[d] + p2[d]) * u + (2 * p0[d] - 5 * p1[d] + 4 * p2[d] - p3[d]) * u2 + (-p0[d] + 3 * p1[d] - 3 * p2[d] + p3[d]) * u3))); }
      }
      out.push(pts[pts.length - 1]); pen.poly(out, false);
    },
  };
  return pen;
}

// Fill + outline (+ inner band, two-tone shade, halftone) in the look's manner.
function spline(pts) { // points along a smooth curve through pts
  const out = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    for (let k = 0; k < 10; k++) { const u = k / 10, u2 = u * u, u3 = u2 * u;
      out.push([0, 1].map((d) => .5 * (2 * p1[d] + (-p0[d] + p2[d]) * u + (2 * p0[d] - 5 * p1[d] + 4 * p2[d] - p3[d]) * u2 + (-p0[d] + 3 * p1[d] - 3 * p2[d] + p3[d]) * u3))); }
  }
  out.push(pts[pts.length - 1]); return out;
}
function look2fill(look, c, feature) {
  if (!c || feature) return c;
  if (look.fill === "none") return null;
  if (look.mono) return look.mono;
  if (look.spot) return nearest(c, look.spot);
  return c;
}
function nearest(c, list) {
  const [r, g, b] = hexRgb(toHex(c)); let best = list[0], bd = 1e9;
  for (const q of list) { const [R, G, B] = hexRgb(q), d = (r - R) ** 2 + (g - G) ** 2 + (b - B) ** 2; if (d < bd) { bd = d; best = q; } }
  return best;
}
function paint(pen, look, fill0, { ink = look.ink || "#141414", outline = look.outline, noShade = false, dotAlpha = .28, feature = false, skin = false } = {}) {
  const { ctx, S } = pen;
  const fill = look2fill(look, fill0, feature);
  if (fill) {
    if (look.fill === "hatch" && !feature) { ctx.fillStyle = skin ? "#fbfaf3" : hatch(ctx, ink); ctx.fill(); }
    else if (look.offset && !feature && pen.last) { // colour printed a little off the line
      pen.trace(pen.last.q, pen.last.closed, look.offset[0] * S, look.offset[1] * S); ctx.fillStyle = fill; ctx.fill(); pen.trace(pen.last.q, pen.last.closed);
    } else if (look.translucent && !feature) { // painted see-through leather, punched with small holes
      ctx.save(); ctx.globalAlpha = .82; ctx.fillStyle = fill; ctx.fill(); ctx.globalAlpha = .55; ctx.fillStyle = perf(ctx); ctx.fill(); ctx.restore();
    } else { ctx.fillStyle = fill; ctx.fill(); }
    if (look.fill === "glass" && !feature && pen.last) { // light glowing through the glass
      const xs = pen.last.q.map((p) => p[0]), ys = pen.last.q.map((p) => p[1]);
      const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
      const gr = ctx.createRadialGradient(x0 + (x1 - x0) * .35, y0 + (y1 - y0) * .3, 1, (x0 + x1) / 2, (y0 + y1) / 2, Math.max(x1 - x0, y1 - y0) * .7);
      gr.addColorStop(0, "rgba(255,255,255,.45)"); gr.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = gr; ctx.fill();
    }

// ---------------------------------------------------------------------------------------------
// One card = background + two characters + the look's extras
// ---------------------------------------------------------------------------------------------
const cards = [];
const grid = document.getElementById("grid");
for (const look of LOOKS) {
  const fig = document.createElement("figure");
  const cv = document.createElement("canvas"); if (look.pixel) cv.className = "px";
  fig.append(cv);
  const cap = document.createElement("figcaption"); cap.innerHTML = `<b></b><small></small>`; cap.querySelector("b").textContent = look.name; cap.querySelector("small").textContent = look.blurb;
  fig.append(cap); grid.append(fig);
  const card = { look, cv, visible: true }; cards.push(card);
  new IntersectionObserver(([e]) => { card.visible = e.isIntersecting; }, { rootMargin: "200px" }).observe(cv);

const layers = new WeakMap();
function layerFor(cv, w, h, i) {

}
let noiseC = null;

  for (let i = 0; i < d.data.length; i += 4) { const v = hash(i, 77) * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = hash(i, 78) > .55 ? 255 : 0; }

function drawCard({ look, cv }, t, turn) {

// ---------------------------------------------------------------------------------------------
// Loop + controls
// ---------------------------------------------------------------------------------------------
let playing = true, t0 = performance.now(), paused = 0, turn = 0, turnTarget = 0;
const playBtn = document.getElementById("play"), sideBtn = document.getElementById("side");
playBtn.onclick = () => { playing = !playing; if (playing) t0 = performance.now() - paused * 1000; playBtn.textContent = playing ? "Playing" : "Paused"; playBtn.classList.toggle("on", playing); };
sideBtn.onclick = () => { turnTarget = turnTarget ? 0 : 1; sideBtn.textContent = turnTarget ? "Turn to front" : "Turn to 3/4"; sideBtn.classList.toggle("on", !!turnTarget); };
const boilIn = document.getElementById("boil"), boilAll = document.getElementById("boilall");
boilIn.oninput = () => { BOIL = +boilIn.value; document.getElementById("boilv").textContent = BOIL.toFixed(1); };
boilAll.onclick = () => { BOIL_ALL = !BOIL_ALL; boilAll.classList.toggle("on", BOIL_ALL); };

function frame(now) {
  const t = playing ? (now - t0) / 1000 : paused;
  if (playing) paused = t;
  turn += (turnTarget - turn) * .12;
  for (const c of cards) if (c.visible) drawCard(c, t, turn);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
