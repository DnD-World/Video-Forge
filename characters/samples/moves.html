<title>Motion library</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1726;--card:#12233a;--ink:#e8f1f2;--muted:#9fb3c8;--mint:#5be3b5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Sora,system-ui,sans-serif}
header{padding:20px 16px 4px;max-width:1500px;margin:0 auto}h1{margin:0;font-size:24px}h1 span{color:var(--mint)}
.bar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:10px 0;color:var(--muted)}
select,button{font:inherit;background:#1c3555;color:var(--ink);border:1px solid #2b4b72;border-radius:999px;padding:4px 12px}
input[type=range]{accent-color:var(--mint)}
main{display:grid;gap:14px;padding:12px 16px 40px;max-width:1500px;margin:0 auto}
figure{margin:0;background:var(--card);border-radius:14px;overflow:hidden}canvas{display:block;width:100%}
figcaption{padding:10px 14px 6px}figcaption small{color:var(--muted)}figcaption code{color:var(--mint);font-size:12px}
.labels{display:flex}.labels span{flex:1;text-align:center;padding:4px 0 8px;color:var(--muted);font-size:12px;letter-spacing:.04em;text-transform:uppercase}

    if (ui.playing) ui.paused = t;
    for (const r of rows) if (r.visible) draw(r, t);
    requestAnimationFrame(frame);
  }
  $("look").innerHTML = LOOKS.map((l) => `<option value="${l.id}">${l.name}</option>`).join("");
  $("look").value = ui.look;
  $("look").onchange = (e) => {
    ui.look = e.target.value;
    rows.forEach((r) => r.layers = []);
  };
  $("who").innerHTML = cards.map((c, i) => `<option value="${i}">${c.name}</option>`).join("");
  $("who").onchange = (e) => {
    ui.who = +e.target.value;
  };
  $("styles").innerHTML = `<option value="all">All side by side</option>` + STYLE_IDS.map((s) => `<option value="${s}">${STYLES[s].label}</option>`).join("");
  $("styles").onchange = (e) => {
    ui.styles = e.target.value;
    build();
  };
  $("move").innerHTML = `<option value="all">Every move</option>` + Object.values(SHELF).map((m) => `<option value="${m.id}">${m.name}</option>`).join("");
  $("move").onchange = (e) => {
    ui.move = e.target.value;
    build();
  };
  $("energy").oninput = (e) => {
    ui.energy = +e.target.value;
  };
  $("play").onclick = () => {
    ui.playing = !ui.playing;
    if (ui.playing) ui.t0 = performance.now() - ui.paused;
    $("play").textContent = ui.playing ? "Pause" : "Play";
  };
  $("count").textContent = `${Object.keys(SHELF).length} moves \xD7 ${STYLE_IDS.length} styles`;
  window.__seek = (ms) => {
    ui.playing = false;
    ui.paused = ms;
    for (const r of rows) draw(r, ms);
  };
  window.__set = (o) => {
    Object.assign(ui, o);
    build();
  };
  build();
  requestAnimationFrame(frame);
  window.__closeup = (id, ms, { style = "neutral", view = 0, framing = "waist", px = 760 } = {}) => {
    let cv = document.getElementById("closeup");
    if (!cv) {
      cv = document.createElement("canvas");
      cv.id = "closeup";
      cv.style.cssText = "position:fixed;inset:0;margin:auto;z-index:9;width:min(96vw,96vh);height:min(96vw,96vh);border-radius:14px";
      document.body.append(cv);
    }
    cv.width = px;
    cv.height = px;
    const ctx = cv.getContext("2d");
    ctx.fillStyle = stage()[0];
    ctx.fillRect(0, 0, px, px);
    const card = { ...cards[ui.who], look: ui.look };
    const fr = frameFor(card, ui.look, framing, { x: 0, y: 0, w: px, h: px });
    const mv = movesAt([{ startMs: 0, endMs: SHELF[id].lengthMs * 1.8, move: id, style }], SHELF, ms, { energy: 0 });
    const base = autoPerformance(ms / 1e3, { talking: false });
    drawFigure(ctx, card, { look: ui.look, S: fr.S, x: fr.x, y: fr.y, state: { ...base, view, joints: mv?.joints ?? null, hands: mv?.hands, props: mv?.props ?? [], smile: mv?.face?.smile ?? 0 }, layerSize: { w: px, h: px }, layerCanvas: document.createElement("canvas") });
    return mv ? { hands: mv.hands, props: mv.props } : null;
  };
  window.__closeupOff = () => document.getElementById("closeup")?.remove();
})();
</script></body></html>
