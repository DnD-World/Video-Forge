# Scans the whole git history for secrets on every push and PR.
# Backstop for githooks/pre-commit (STANDARDS.md §4).
name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.24.0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Runs the gitleaks binary directly: the official action needs a paid
      # license key on organization accounts like DnD-World.
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Scan full history
        run: gitleaks git --verbose --redact --exit-code 1 .
